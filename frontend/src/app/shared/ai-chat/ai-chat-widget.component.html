<div class="ai-chat" #wrap>
  <div class="ai-chat__fabs">
    <button type="button" class="ai-chat__fab is-support" (click)="toggleSupport()" aria-label="Chat với nhân viên">
      <span class="ai-chat__fab-text">💬</span>
    </button>

    <button type="button" class="ai-chat__fab" (click)="toggle()" aria-label="Chat AI">
      <span class="ai-chat__fab-dot" *ngIf="!open"></span>
      <span class="ai-chat__fab-text">AI</span>
    </button>
  </div>

  <div class="ai-chat__panel" *ngIf="open" (click)="$event.stopPropagation()">
    <div class="ai-chat__head">
      <div class="ai-chat__title">Chat AI</div>
      <button type="button" class="ai-chat__close" (click)="close()" aria-label="Đóng">✕</button>
    </div>

    <div class="ai-chat__body" #list>
      <div class="ai-chat__empty" *ngIf="messages.length === 0">
        Hãy nhập câu hỏi để bắt đầu.
      </div>

      <div class="ai-chat__msg" *ngFor="let m of messages" [class.is-user]="m.role === 'user'" [class.is-ai]="m.role === 'ai'">
        <div class="ai-chat__bubble">{{ m.text }}</div>
      </div>

      <div class="ai-chat__msg is-ai" *ngIf="sending">
        <div class="ai-chat__bubble">Đang trả lời...</div>
      </div>

      <div class="ai-chat__error" *ngIf="error">{{ error }}</div>
    </div>

    <div class="ai-chat__foot">
      <div class="ai-chat__quota" *ngIf="isGuestLimited()">
        <ng-container *ngIf="!quotaLoading; else quotaLoadingTpl">
          <span *ngIf="quotaRemaining != null">Khách: còn {{ quotaRemaining }}/{{ quotaLimit }} lượt hôm nay</span>
          <span *ngIf="quotaRemaining == null">Khách: đang kiểm tra lượt...</span>
        </ng-container>
        <ng-template #quotaLoadingTpl>
          <span>Khách: đang kiểm tra lượt...</span>
        </ng-template>
      </div>

      <textarea
        class="ai-chat__input"
        rows="1"
        [disabled]="!canSend()"
        [(ngModel)]="input"
        placeholder="Nhập câu hỏi..."
        (keydown)="onInputKeydown($any($event))"
      ></textarea>
      <button type="button" class="ai-chat__send" [disabled]="!canSend()" (click)="send()">Gửi</button>
    </div>
  </div>

  <div class="ai-chat__panel" *ngIf="supportOpen" (click)="$event.stopPropagation()">
    <div class="ai-chat__head">
      <div class="ai-chat__title">Chat với nhân viên</div>
      <button type="button" class="ai-chat__close" (click)="closeSupport()" aria-label="Đóng">✕</button>
    </div>

    <div class="ai-chat__body" #supportList>
      <div class="ai-chat__empty" *ngIf="supportMessages.length === 0">
        Hãy nhập tin nhắn để nhân viên hỗ trợ.
      </div>

      <div class="ai-chat__msg" *ngFor="let m of supportMessages" [class.is-user]="m.sender === 'CUSTOMER'" [class.is-ai]="m.sender === 'STAFF'">
        <div class="ai-chat__bubble">{{ m.text }}</div>
      </div>

      <div class="ai-chat__msg is-ai" *ngIf="supportSending">
        <div class="ai-chat__bubble">Đang gửi...</div>
      </div>

      <div class="ai-chat__error" *ngIf="supportError">{{ supportError }}</div>
    </div>

    <div class="ai-chat__foot">
      <textarea
        class="ai-chat__input"
        rows="1"
        [disabled]="supportSending"
        [(ngModel)]="supportInput"
        placeholder="Nhập tin nhắn cho nhân viên..."
        (keydown)="onSupportInputKeydown($any($event))"
      ></textarea>
      <button type="button" class="ai-chat__send" [disabled]="supportSending" (click)="sendSupport()">Gửi</button>
    </div>
  </div>
</div>
