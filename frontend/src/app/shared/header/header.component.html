<div class="tl-topbar">
  <button type="button" class="tl-topbar__arrow" aria-label="Prev">‹</button>
  <div class="tl-topbar__text">{{ promoText }}</div>
  <button type="button" class="tl-topbar__arrow" aria-label="Next">›</button>
</div>

<header class="tl-header" (click)="showSuggest = false">
  <div class="container tl-header__inner">
    <a class="tl-header__brand" routerLink="/" aria-label="Home">
      <span class="tl-header__brand-text">
        <span class="tl-header__brand-fashion">FASHION</span>
        <span class="tl-header__brand-hub">HUB</span>
      </span>
    </a>

    <div class="tl-header__search" (click)="$event.stopPropagation()">
      <input
        class="tl-header__search-input"
        type="text"
        placeholder="Tìm kiếm..."
        [value]="searchQuery"
        (focus)="onSearchFocus()"
        (input)="onSearchInput($any($event.target).value)"
        (keydown)="onSearchKeydown($any($event))"
      />
      <button type="button" class="tl-header__search-btn" aria-label="Search" (click)="submitSearch()">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M10.5 3a7.5 7.5 0 1 1 0 15a7.5 7.5 0 0 1 0-15Zm0 2a5.5 5.5 0 1 0 0 11a5.5 5.5 0 0 0 0-11Zm7.76 11.35l2.39 2.39a1 1 0 0 1-1.41 1.41l-2.39-2.39a1 1 0 0 1 1.41-1.41Z"
          />
        </svg>
      </button>

      <div class="tl-header__suggest" *ngIf="showSuggest && suggest.length > 0">
        <button
          type="button"
          class="tl-header__suggest-item"
          *ngFor="let s of suggest; let i = index"
          (click)="selectSuggestion(s.slug)"
          (mouseenter)="activeSuggestIndex = i"
          [class.active]="i === activeSuggestIndex"
        >
          {{ s.label }}
        </button>
      </div>
    </div>

    <div class="tl-header__icons">
      <a class="tl-header__icon" routerLink="/cart" aria-label="Cart">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M7 7h14l-1.4 12.6a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8L5 4H2a1 1 0 1 1 0-2h3a1 1 0 0 1 .99.86L6.16 5H20a1 1 0 0 1 .99 1.11L19.5 20.2a4 4 0 0 1-4 3.8H8.5a4 4 0 0 1-4-3.8L3.02 4.86A1 1 0 0 1 4 4h.12L5 7H7Zm3.5 5a1 1 0 0 0 1-1V9.5a1 1 0 1 0-2 0V11a1 1 0 0 0 1 1Zm6 0a1 1 0 0 0 1-1V9.5a1 1 0 1 0-2 0V11a1 1 0 0 0 1 1Z"
          />
        </svg>
        <span class="tl-header__badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <a class="tl-header__icon" routerLink="/pages/yeu-thich" aria-label="Yêu thích">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M12 21.2l-1.1-1C6.2 15.9 3 13 3 9.6A4.6 4.6 0 0 1 7.6 5c1.5 0 2.9.7 3.8 1.8C12.3 5.7 13.7 5 15.2 5A4.6 4.6 0 0 1 19.8 9.6c0 3.4-3.2 6.3-7.9 10.6l-1.9 1Z"
          />
        </svg>
      </a>

      <ng-container *ngIf="isAuthenticated(); else guestAccount">
        <div class="tl-header__account" (click)="$event.stopPropagation()">
          <button class="tl-header__avatar" type="button" aria-label="Tài khoản" (click)="toggleUserMenu($any($event))">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M12 12.2a4.6 4.6 0 1 1 0-9.2a4.6 4.6 0 0 1 0 9.2Zm0-2a2.6 2.6 0 1 0 0-5.2a2.6 2.6 0 0 0 0 5.2ZM4 20.5a8 8 0 0 1 16 0a1 1 0 1 1-2 0a6 6 0 0 0-12 0a1 1 0 1 1-2 0Z"
              />
            </svg>
          </button>
          <div class="tl-header__menu" *ngIf="userMenuOpen">
            <a class="tl-header__menu-item" routerLink="/profile">Thông tin tài khoản</a>
            <button class="tl-header__menu-item danger" type="button" (click)="logout()">Đăng xuất</button>
          </div>
        </div>
      </ng-container>

      <ng-template #guestAccount>
        <a class="tl-header__icon" routerLink="/login" aria-label="Account">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 12.2a4.6 4.6 0 1 1 0-9.2a4.6 4.6 0 0 1 0 9.2Zm0-2a2.6 2.6 0 1 0 0-5.2a2.6 2.6 0 0 0 0 5.2ZM4 20.5a8 8 0 0 1 16 0a1 1 0 1 1-2 0a6 6 0 0 0-12 0a1 1 0 1 1-2 0Z"
            />
          </svg>
        </a>
      </ng-template>
    </div>
  </div>

  <nav class="tl-nav" (mouseenter)="onNavAreaEnter()" (mouseleave)="onNavAreaLeave()">
    <div class="container tl-nav__inner">
      <a class="tl-nav__item" routerLink="/sale" aria-label="Sale">
        <span class="tl-nav__item-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M4 4h10l6 6-10 10-6-6V4Zm4 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm2 9 7-7" />
          </svg>
        </span>
        <span>Sale</span>
      </a>
      <div class="tl-nav__group" *ngFor="let root of categoryTree" [class.is-open]="openMegaRootId === root.id">
        <a
          class="tl-nav__item"
          [routerLink]="['/category', root.slug]"
          (mouseenter)="onRootHover(root)"
          (click)="onRootCategoryClick(root, $any($event))"
        >
          <span class="tl-nav__item-icon" aria-hidden="true" [ngClass]="'tl-nav__item-icon--' + resolveCategoryIcon(root.icon)">
            <svg viewBox="0 0 24 24" focusable="false" [ngSwitch]="resolveCategoryIcon(root.icon)">
              <path *ngSwitchCase="'home'" d="M12 3l9 8h-3v9H6v-9H3l9-8Z" />
              <path *ngSwitchCase="'grid'" d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z" />
              <path *ngSwitchCase="'folder'" d="M3 6h7l2 2h9v12H3V6Zm2 4v8h14v-8H5Z" />
              <path *ngSwitchCase="'box'" d="M4 7l8-4 8 4v10l-8 4-8-4V7Zm8-2.2L6.2 7 12 9.8 17.8 7 12 4.8Zm0 7L6 9v6.6l6 3V11.8Zm2 0v6.8l6-3V9l-6 2.8Z" />
              <path *ngSwitchCase="'tag'" d="M3 12l9 9 9-9-9-9H3v9Zm5-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" />
              <path *ngSwitchCase="'sparkle'" d="M12 2l1.2 5.1L18 9l-4.8 1.9L12 16l-1.2-5.1L6 9l4.8-1.9L12 2Zm8 10 0.7 2.8L23 16l-2.3 1.2L20 20l-0.7-2.8L17 16l2.3-1.2L20 12Z" />
              <path *ngSwitchCase="'gift'" d="M20 7h-2.2A3 3 0 0 0 12 5.3 3 3 0 0 0 6.2 7H4v4h16V7Zm-9-2a1.5 1.5 0 1 1-3 0c0-.8.7-1.5 1.5-1.5S11 4.2 11 5Zm5 0a1.5 1.5 0 1 1-3 0c0-.8.7-1.5 1.5-1.5S16 4.2 16 5Zm4 8H4v9h7v-7h2v7h7v-9Z" />
              <path *ngSwitchCase="'star'" d="M12 2l3.1 6.3 7 1-5.1 5 1.2 7-6.2-3.3-6.2 3.3 1.2-7L1.9 9.3l7-1L12 2Z" />
              <path *ngSwitchCase="'heart'" d="M12 21s-7-4.6-9.5-8.7C0.6 9.2 2.3 5.9 5.7 5.1c1.9-.5 3.8.2 5 1.6 1.2-1.4 3.1-2.1 5-1.6 3.4.8 5.1 4.1 3.2 7.2C19 16.4 12 21 12 21Z" />
              <path *ngSwitchCase="'truck'" d="M3 7h11v9H3V7Zm11 3h4l3 3v3h-7v-6Zm-9 9a2 2 0 1 0 4 0H5Zm10 0a2 2 0 1 0 4 0h-4Z" />
              <path *ngSwitchCase="'phone'" d="M7 3h10v18H7V3Zm2 3h6v1H9V6Zm0 12h6v2H9v-2Z" />
              <path *ngSwitchCase="'user'" d="M12 12.2a4.6 4.6 0 1 1 0-9.2a4.6 4.6 0 0 1 0 9.2ZM4 20.5a8 8 0 0 1 16 0a1 1 0 1 1-2 0a6 6 0 0 0-12 0a1 1 0 1 1-2 0Z" />
              <path *ngSwitchCase="'settings'" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 4-2.1.7c-.1.4-.2.8-.4 1.2l1.3 1.8-1.4 1.4-1.8-1.3c-.4.2-.8.3-1.2.4L16 21h-2l-.7-2.1c-.4-.1-.8-.2-1.2-.4L10.3 20 8.9 18.6l1.3-1.8c-.2-.4-.3-.8-.4-1.2L7 14v-2l2.1-.7c.1-.4.2-.8.4-1.2L8.2 8.3 9.6 6.9l1.8 1.3c.4-.2.8-.3 1.2-.4L14 3h2l.7 2.1c.4.1.8.2 1.2.4l1.8-1.3 1.4 1.4-1.3 1.8c.2.4.3.8.4 1.2L21 10v2Z" />
              <path *ngSwitchCase="'shirt'" d="M12 3l4 2 2-1 3 4-3 2v11H6V10L3 8l3-4 2 1 4-2Z" />
              <path *ngSwitchCase="'pants'" d="M8 3h8l1 19h-4l-1-9-1 9H7L8 3Z" />
              <path *ngSwitchCase="'dress'" d="M12 2l3 6-2 2 3 12H8l3-12-2-2 3-6Z" />
              <path *ngSwitchCase="'shoe'" d="M3 16h6l3-3 6 3h3v4H3v-4Zm9-6 2 2 5 2H7l5-6Z" />
              <path *ngSwitchCase="'bag'" d="M7 7V6a5 5 0 0 1 10 0v1h3v15H4V7h3Zm2 0h6V6a3 3 0 0 0-6 0v1Z" />
              <path *ngSwitchCase="'watch'" d="M9 2h6l1 3v14l-1 3H9l-1-3V5l1-3Zm3 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm0 2v2l2 1" />
              <path *ngSwitchCase="'hat'" d="M12 3c4 0 7 3 7 7v2H5v-2c0-4 3-7 7-7Zm-9 12h18v2H3v-2Z" />
              <path *ngSwitchCase="'sale'" d="M4 4h10l6 6-10 10-6-6V4Zm4 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm2 9 7-7" />
              <path *ngSwitchCase="'new'" d="M6 18V6h2l8 8V6h2v12h-2l-8-8v8H6Z" />
              <path *ngSwitchDefault d="M3 12l9 9 9-9-9-9H3v9Zm5-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z" />
            </svg>
          </span>
          <span>{{ root.name }}</span>
        </a>
      </div>
      <a class="tl-nav__item" routerLink="/news">
        <span class="tl-nav__item-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M4 4h14a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4Zm4 4h8V6H8v2Zm0 4h10v-2H8v2Zm0 4h10v-2H8v2Z" />
          </svg>
        </span>
        <span>Tin tức</span>
      </a>
      <a class="tl-nav__item" routerLink="/">
        <span class="tl-nav__item-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M3 7h14v10H3V7Zm16 3h2v7h-2v-7Zm-8 9h6v2H7v-2Zm-5-2h2v2H6v-2Z" />
          </svg>
        </span>
        <span>Tra cứu đơn hàng</span>
      </a>
    </div>

    <ng-container *ngIf="getOpenRoot() as root">
      <div
        class="tl-nav__panel"
        *ngIf="root.children && root.children.length > 0"
        (mouseenter)="onNavAreaEnter()"
        (mouseleave)="onNavAreaLeave()"
        (click)="$event.stopPropagation()"
      >
        <div class="container tl-nav__panel-inner">
          <div class="tl-nav__panel-col" *ngFor="let lv2 of root.children">
            <a class="tl-nav__panel-title" [routerLink]="['/category', lv2.slug]">{{ lv2.name }}</a>
            <a class="tl-nav__panel-link" *ngFor="let lv3 of (lv2.children || [])" [routerLink]="['/category', lv3.slug]">
              {{ lv3.name }}
            </a>
          </div>
        </div>
      </div>
    </ng-container>
  </nav>
</header>
