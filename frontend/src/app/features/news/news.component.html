<main class="bg-[var(--fh-bg)]">
  <div class="mx-auto w-full max-w-[1280px] px-4 py-8">
    <div class="flex items-start justify-between gap-4">
      <div>
        <div class="text-2xl font-extrabold text-[var(--fh-text)]">Tin tức</div>
        <div class="mt-1 text-sm font-semibold text-[var(--fh-muted)]">Thông báo, bài viết và cập nhật mới nhất</div>
      </div>
      <a routerLink="/sale" class="text-sm font-bold text-[var(--fh-primary)]">Về trang chủ</a>
    </div>

    <div *ngIf="banners.length > 0" class="mt-6 space-y-5">
      <a
        *ngFor="let b of banners"
        [routerLink]="b.route"
        class="block overflow-hidden rounded-2xl border border-black/10 bg-white shadow-sm"
      >
        <div class="relative w-full aspect-[21/9] bg-gray-100">
          <img [src]="b.imageUrl" [alt]="b.title" class="absolute inset-0 w-full h-full object-cover" />
          <div class="absolute inset-x-0 bottom-0 p-5 bg-gradient-to-t from-black/70 via-black/20 to-transparent">
            <div class="text-white text-xl sm:text-2xl font-extrabold leading-tight">{{ b.title }}</div>
            <div *ngIf="b.description" class="mt-1 text-white/90 text-sm font-semibold line-clamp-2">{{ b.description }}</div>
          </div>
        </div>
      </a>
    </div>

    <div *ngIf="error" class="mt-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">
      {{ error }}
    </div>

    <div class="mt-6 rounded-2xl border border-black/10 bg-white p-6 shadow-sm">
      <div class="text-sm font-semibold text-[var(--fh-muted)]">Trang Tin tức đang được phát triển. Nội dung banner phía trên được cấu hình từ Admin.</div>
    </div>
  </div>
</main>
