<div class="page">
  <div class="page-head">
    <div class="title">Mã giảm giá</div>
    <button class="btn" type="button" (click)="load()" [disabled]="loading">
      {{ loading ? 'Đang tải...' : 'Làm mới' }}
    </button>
  </div>

  <div class="alert" *ngIf="error">{{ error }}</div>

  <div class="card">
    <table class="tbl">
      <thead>
        <tr>
          <th style="width: 90px">ID</th>
          <th style="width: 160px">Code</th>
          <th>Mô tả</th>
          <th style="width: 120px" class="right">%/Giảm</th>
          <th style="width: 120px" class="right">Đã dùng</th>
          <th style="width: 120px">Trạng thái</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="!loading && rows.length === 0">
          <td colspan="6" class="empty">Chưa có mã giảm giá.</td>
        </tr>
        <tr *ngFor="let r of rows">
          <td>#{{ r.id }}</td>
          <td class="strong">{{ r.code }}</td>
          <td class="muted">{{ r.description || '-' }}</td>
          <td class="right">{{ r.discountPercent ?? (r.discountAmount ?? 0) }}</td>
          <td class="right">{{ r.usedCount ?? 0 }}/{{ r.usageLimit ?? '-' }}</td>
          <td>
            <span class="badge" [class.off]="r.active === false">{{ r.active === false ? 'Tắt' : 'Bật' }}</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
