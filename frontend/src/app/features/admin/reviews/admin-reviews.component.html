<div class="page">
  <div class="page-head">
    <div class="title">Đánh giá</div>
    <button class="btn" type="button" (click)="load()" [disabled]="loading">
      {{ loading ? 'Đang tải...' : 'Làm mới' }}
    </button>
  </div>

  <div class="alert" *ngIf="error">{{ error }}</div>

  <div class="card">
    <table class="tbl">
      <thead>
        <tr>
          <th style="width: 90px">ID</th>
          <th style="width: 110px">Product</th>
          <th style="width: 90px">User</th>
          <th style="width: 90px" class="right">Rating</th>
          <th>Comment</th>
          <th style="width: 200px">Thời gian</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="!loading && rows.length === 0">
          <td colspan="6" class="empty">Chưa có đánh giá.</td>
        </tr>
        <tr *ngFor="let r of rows">
          <td>#{{ r.id }}</td>
          <td>{{ r.productId }}</td>
          <td>{{ r.userId }}</td>
          <td class="right"><span class="badge">{{ r.rating ?? 0 }}</span></td>
          <td class="muted">{{ r.comment || '-' }}</td>
          <td>{{ formatDate(r.createdAt) }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
