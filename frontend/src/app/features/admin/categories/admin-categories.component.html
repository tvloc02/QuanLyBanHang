<div class="page">
  <div class="page-head">
    <div class="title">Danh mục</div>
    <div class="head-actions">
      <button class="btn" type="button" (click)="openCreate()" [disabled]="loading">Thêm danh mục</button>
      <button class="btn" type="button" (click)="load()" [disabled]="loading">
        {{ loading ? 'Đang tải...' : 'Làm mới' }}
      </button>
    </div>
  </div>

  <div class="alert" *ngIf="error">{{ error }}</div>

  <div class="card">
    <table class="tbl">
      <thead>
        <tr>
          <th style="width: 90px">ID</th>
          <th>Tên</th>
          <th>Mô tả</th>
          <th style="width: 120px">Trạng thái</th>
          <th style="width: 160px">Thao tác</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="!loading && rows.length === 0">
          <td colspan="5" class="empty">Chưa có danh mục.</td>
        </tr>
        <tr *ngFor="let r of rows">
          <td>#{{ r.id }}</td>
          <td class="strong">{{ r.name }}</td>
          <td class="muted">{{ r.description || '-' }}</td>
          <td>
            <span class="badge" [class.off]="r.active === false">{{ r.active === false ? 'Ẩn' : 'Đang bật' }}</span>
          </td>
          <td>
            <div class="row-actions">
              <button class="btn small" type="button" (click)="onEdit(r)">Cấu hình</button>
              <button class="btn small danger" type="button" (click)="onDelete(r)" [disabled]="loading">Xóa</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal tạo danh mục -->
  <div class="overlay" *ngIf="createOpen">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Tạo danh mục">
      <div class="modal-head">
        <div class="modal-title">Tạo danh mục</div>
        <button class="icon" type="button" (click)="cancelCreate()">✕</button>
      </div>
      <div class="form" style="padding:16px">
        <div class="grid2">
          <div class="field">
            <label class="label">Tên danh mục</label>
            <input class="input" [(ngModel)]="form.name" placeholder="Ví dụ: Áo sơ mi" />
          </div>
          <div class="field">
            <label class="label">Trạng thái</label>
            <select class="input" [(ngModel)]="form.active">
              <option [ngValue]="true">Đang bật</option>
              <option [ngValue]="false">Ẩn</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="label">Mô tả</label>
          <textarea class="textarea" rows="3" [(ngModel)]="form.description" placeholder="Mô tả ngắn..."></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" type="button" (click)="cancelCreate()">Hủy</button>
          <button class="btn" type="button" (click)="submitCreate()" [disabled]="createLoading">{{ createLoading ? 'Đang lưu...' : 'Tạo danh mục' }}</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal cấu hình danh mục -->
  <div class="overlay" *ngIf="editOpen">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Cấu hình danh mục">
      <div class="modal-head">
        <div class="modal-title">Cấu hình danh mục</div>
        <button class="icon" type="button" (click)="cancelEdit()">✕</button>
      </div>
      <div class="form" style="padding:16px">
        <div class="grid2">
          <div class="field">
            <label class="label">Tên danh mục</label>
            <input class="input" [(ngModel)]="editForm.name" />
          </div>
          <div class="field">
            <label class="label">Trạng thái</label>
            <select class="input" [(ngModel)]="editForm.active">
              <option [ngValue]="true">Đang bật</option>
              <option [ngValue]="false">Ẩn</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="label">Mô tả</label>
          <textarea class="textarea" rows="3" [(ngModel)]="editForm.description" placeholder="Mô tả ngắn..."></textarea>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" type="button" (click)="cancelEdit()">Hủy</button>
          <button class="btn" type="button" (click)="submitEdit()" [disabled]="editLoading">{{ editLoading ? 'Đang lưu...' : 'Lưu thay đổi' }}</button>
        </div>
      </div>
    </div>
  </div>
</div>
