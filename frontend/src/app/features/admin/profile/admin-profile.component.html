<div class="space-y-6">
  <div class="bg-gradient-to-r from-blue-600 to-blue-500 rounded-2xl shadow-xl p-5 sm:p-6 lg:p-8 text-white">
    <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
      <div class="flex items-start sm:items-center gap-4 min-w-0">
        <div class="w-12 h-12 sm:w-14 sm:h-14 bg-white/20 rounded-xl flex items-center justify-center shrink-0">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21a8 8 0 0 0-16 0" />
            <path d="M12 11a4 4 0 1 0-4-4a4 4 0 0 0 4 4Z" />
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-2xl sm:text-3xl font-bold mb-1 leading-tight">Thông tin tài khoản</h1>
          <p class="text-blue-100 text-sm sm:text-base">Hồ sơ nội bộ (Admin / Giám sát / Nhân viên)</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto sm:justify-end">
        <button
          type="button"
          (click)="load()"
          [disabled]="loading || saving"
          class="flex items-center gap-2 px-3 py-2 sm:px-4 bg-white/20 text-white rounded-xl hover:bg-white/30 transition-all font-semibold disabled:opacity-60 whitespace-nowrap text-sm"
        >
          <span>{{ loading ? 'Đang tải...' : 'Làm mới' }}</span>
        </button>

        <button
          type="button"
          (click)="save()"
          [disabled]="loading || saving"
          class="flex items-center gap-2 px-3 py-2 sm:px-4 bg-white text-blue-700 rounded-xl hover:bg-blue-50 transition-all font-extrabold whitespace-nowrap text-sm disabled:opacity-60"
        >
          <span>{{ saving ? 'Đang lưu...' : 'Lưu thay đổi' }}</span>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl font-semibold">
    {{ error }}
  </div>

  <div *ngIf="success" class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl font-semibold">
    {{ success }}
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
    <div class="lg:col-span-8 space-y-4">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 bg-gradient-to-r from-blue-50 to-sky-50">
          <div class="text-sm font-extrabold text-gray-900">Hồ sơ</div>
          <div class="text-xs font-semibold text-gray-600 mt-1">Cập nhật thông tin liên hệ cơ bản</div>
        </div>

        <div class="p-5">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-extrabold text-gray-900 mb-2">Username</label>
              <input
                class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm font-semibold bg-gray-50 text-gray-900"
                [value]="me?.username || ''"
                readonly
              />
            </div>
            <div>
              <label class="block text-sm font-extrabold text-gray-900 mb-2">Email</label>
              <input
                class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm font-semibold bg-gray-50 text-gray-900"
                [value]="me?.email || ''"
                readonly
              />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
            <div>
              <label class="block text-sm font-extrabold text-gray-900 mb-2">Họ tên</label>
              <input
                class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm font-semibold placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400"
                [(ngModel)]="form.fullName"
                placeholder="Nhập họ tên"
              />
            </div>
            <div>
              <label class="block text-sm font-extrabold text-gray-900 mb-2">Số điện thoại</label>
              <input
                class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm font-semibold placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400"
                [(ngModel)]="form.phone"
                placeholder="Nhập số điện thoại"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
            <div>
              <label class="block text-sm font-extrabold text-gray-900 mb-2">Tỉnh/Thành</label>
              <input
                class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm font-semibold placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400"
                [(ngModel)]="form.province"
                placeholder="VD: TP. Hồ Chí Minh"
              />
            </div>
            <div>
              <label class="block text-sm font-extrabold text-gray-900 mb-2">Quận/Huyện</label>
              <input
                class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm font-semibold placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400"
                [(ngModel)]="form.district"
                placeholder="VD: Quận 1"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
            <div>
              <label class="block text-sm font-extrabold text-gray-900 mb-2">Phường/Xã</label>
              <input
                class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm font-semibold placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400"
                [(ngModel)]="form.ward"
                placeholder="VD: Phường Bến Nghé"
              />
            </div>
            <div>
              <label class="block text-sm font-extrabold text-gray-900 mb-2">Địa chỉ chi tiết</label>
              <input
                class="w-full h-11 rounded-xl border border-gray-200 px-3 text-sm font-semibold placeholder:text-gray-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-400"
                [(ngModel)]="form.addressDetail"
                placeholder="Số nhà, đường..."
              />
            </div>
          </div>

          <div class="mt-4 text-xs font-semibold text-gray-600">
            Email/username hiện chưa cho phép sửa ở đây.
          </div>
        </div>
      </div>
    </div>

    <div class="lg:col-span-4 space-y-4">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-100 bg-gradient-to-r from-blue-50 to-sky-50">
          <div class="text-sm font-extrabold text-gray-900">Quyền</div>
          <div class="text-xs font-semibold text-gray-600 mt-1">Thông tin phân quyền</div>
        </div>

        <div class="p-5">
          <div class="text-sm font-semibold text-gray-700">
            Tài khoản nội bộ có thể truy cập Admin theo role được cấp.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
