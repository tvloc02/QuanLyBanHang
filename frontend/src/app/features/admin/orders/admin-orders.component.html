<div class="page">
  <div class="page-head">
    <div class="title">{{ viewTitle }}</div>
    <button class="btn" type="button" (click)="load()" [disabled]="loading">
      {{ loading ? 'Đang tải...' : 'Làm mới' }}
    </button>
  </div>

  <div class="alert" *ngIf="error">{{ error }}</div>
  <div class="alert" *ngIf="!error && viewNote">{{ viewNote }}</div>

  <div class="card">
    <table class="tbl">
      <thead>
        <tr>
          <th style="width: 90px">Mã</th>
          <th style="width: 90px">User</th>
          <th style="width: 140px">Trạng thái</th>
          <th style="width: 120px" class="right">Tổng</th>
          <th style="width: 110px" class="right">SL item</th>
          <th style="width: 140px">Coupon</th>
          <th>Thời gian</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="!loading && rows.length === 0">
          <td colspan="7" class="empty">Chưa có đơn hàng.</td>
        </tr>
        <tr *ngFor="let r of rows">
          <td>#{{ r.id }}</td>
          <td>{{ r.userId }}</td>
          <td><span class="badge">{{ r.status }}</span></td>
          <td class="right">{{ r.total }}</td>
          <td class="right">{{ r.itemCount }}</td>
          <td>{{ r.couponCode || '-' }}</td>
          <td>{{ formatDate(r.createdAt) }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
